app:
  environment: dev
  runtime_mode: dev_fallback
  enable_disclaimer: true

asr:
  provider: funasr_streaming
  model_name: speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404
  sample_rate: 16000
  chunk_ms: 200
  vad_threshold: 0.01
  min_silence_ms: 300
  use_mock_fallback: true

llm:
  provider: qwen_chat
  model_path: /models/qwen-7b-chat-awq
  quant_type: awq
  max_new_tokens: 256
  temperature: 0.7
  use_mock_fallback: true

tts:
  provider: cosyvoice
  voice: xiaofeng
  emotion: friendly
  sample_rate: 22050
  cache_dir: .cache/tts
  use_mock_fallback: true

realtime:
  barge_in_enabled: true
  min_silence_ms: 300
  queue_max_size: 16

device:
  prefer_device: auto
  asr_device: cpu
  llm_device: cuda:0
  tts_device: cpu

vision:
  insightface:
    model_pack: buffalo_l
